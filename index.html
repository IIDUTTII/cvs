<!DOCTYPE html>
<html>
<head>
    <title>CV Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 48px 56px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e5ed;
            max-width: 550px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: #8888aa;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }
        .cv-grid { display: grid; gap: 12px; }
        .cv-link {
            display: block;
            padding: 16px 20px;
            background: #f7f8fa;
            text-decoration: none;
            color: #1a1a2e;
            border: 1px solid #e2e5ed;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .cv-link:hover {
            border-color: #4a6cf7;
            transform: translateX(6px);
            box-shadow: 0 4px 20px rgba(74, 108, 247, 0.08);
        }
        .cv-link .name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1a1a2e;
        }
        .cv-link .name .badge {
            display: inline-block;
            background: #4a6cf7;
            color: #ffffff;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }
        .cv-link .role {
            color: #8888aa;
            font-size: 0.9rem;
        }
        .cv-link .path {
            color: #aaaaaa;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .empty {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .empty .name { color: #999999 !important; }
        .empty .badge { background: #999999 !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CV Portfolio</h1>
        <p class="subtitle">Select a candidate's CV</p>
        <div class="cv-grid">
            <a href="CV.Bhawani-Dutt.pahads.in" class="cv-link">
                <div class="name">Bhawani Dutt <span class="badge">Data Scientist</span></div>
                <div class="role">Aspiring Data Scientist & AI Engineer</div>
                <div class="path">📁 bhawani-dutt/</div>
            </a>
            <a href="#" class="cv-link empty">
                <div class="name">Jane Smith <span class="badge">Coming Soon</span></div>
                <div class="role">UX Designer</div>
                <div class="path">📁 jane/</div>
            </a>
            <a href="#" class="cv-link empty">
                <div class="name">Alex Johnson <span class="badge">Coming Soon</span></div>
                <div class="role">Software Engineer</div>
                <div class="path">📁 alex/</div>
            </a>
        </div>
    </div>
</body>
</html>
